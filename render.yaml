# Optional backend host. The same Dockerfile works on other Node/container hosts.
# Import only after adding this directory to your own Git repository.
services:
  - type: web
    name: quecare-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: quecare-private
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

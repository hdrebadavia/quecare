name: Validate deployment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: quecare
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: quecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quecare -d quecare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://quecare:ci-only-password@localhost:5432/quecare_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run check:cloudflare
      - run: docker build -t quecare-api:ci .
